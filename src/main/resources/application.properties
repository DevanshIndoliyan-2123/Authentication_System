
# ==========================================
# Application
# ==========================================
spring.application.name=Authentication_System

# ==========================================
# Supabase PostgreSQL Database
# Configure these environment variables in IntelliJ
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Format SQL in console output
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# HikariCP Connection Pool
# ==========================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=300000

# ==========================================
# JWT Authentication
# Keep your existing property name if your
# Java code expects a different name.
# ==========================================
jwt.secret=${JWT_SECRET}

# ==========================================
# Brevo SMTP Email Configuration
# ==========================================
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${BREVO_SMTP_KEY}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.from=${MAIL_FROM}
